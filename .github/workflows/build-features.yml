# Downloads the raw KAIST run-to-failure dataset (~18.5 GB of CSV) from Mendeley Data,
# aggregates it into compact condition-indicator tables with pipeline/build_features.py,
# and commits the results to data/processed/ so the notebook can load them by URL.
name: Build features from the raw dataset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipeline/build_features.py"
      - ".github/workflows/build-features.yml"

permissions:
  contents: write

concurrency:
  group: build-features
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the raw archive is several GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install numpy pandas scipy requests

      - name: Download and aggregate the dataset
        run: |
          set -o pipefail
          python pipeline/build_features.py --download \
            --workdir "$RUNNER_TEMP/raw" --out data/processed --workers 4 2>&1 | tee "$RUNNER_TEMP/build_log.txt"
          cp "$RUNNER_TEMP/build_log.txt" data/processed/build_log.txt

      - name: Summary
        if: always()
        run: |
          echo '### Processed outputs' >> "$GITHUB_STEP_SUMMARY"
          ls -la data/processed >> "$GITHUB_STEP_SUMMARY" || true
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat data/processed/manifest.json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: processed-data
          path: data/processed
          if-no-files-found: warn

      - name: Commit processed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed
          git commit -m "Add processed features from the raw dataset (automated) [skip ci]" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
